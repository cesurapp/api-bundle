name: App Tester
on:
  push:
  pull_request:

jobs:
  phpunit:
    # Configuration
    name: App Test (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: ['locked']
        include:
          # Lowest allowed versions of the direct dependencies (what an app may still have installed)
          - php: '8.4'
            dependencies: 'lowest'

    # Steps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install PHP
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: :xdebug
      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      # Run Tests
      - name: Install App Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Lowest Direct Dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --prefer-lowest doctrine/orm giggsey/libphonenumber-for-php-lite phpunit/phpunit symfony/polyfill-php86
      - name: PHPCS Fixer
        run: composer qa:lint
      - name: PhpStan
        run: composer qa:phpstan
      - name: Execute PHPUnit
        run: composer test:stop
